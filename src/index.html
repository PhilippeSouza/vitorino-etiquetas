<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Montar Etiquetas A4</title>
  <style>
/*ESTILO*/
  </style>
</head>
<body>
  <main>
    <h1>Montar Etiquetas A4</h1>
    <p class="subtitulo">Junte o DANFE simplificado e a etiqueta de transporte na mesma folha A4, para imprimir de uma vez.</p>

    <fieldset class="opcoes" id="opcoes">
      <legend>Pedidos por folha A4</legend>
      <label class="opcao">
        <input type="radio" name="porFolha" value="1" checked>
        <span><strong>1 pedido</strong> Folha em pé, tamanho real</span>
      </label>
      <label class="opcao">
        <input type="radio" name="porFolha" value="2">
        <span><strong>2 pedidos</strong> Folha deitada, economiza papel (DANFE a ~66%)</span>
      </label>
    </fieldset>

    <label class="zona" id="zona">
      <strong>Arraste o PDF aqui</strong>
      <span>ou clique para escolher (Shopee, TikTok, Amazon, Magalu)</span>
      <input type="file" id="entrada" accept="application/pdf,.pdf" multiple>
    </label>
    <p class="privacidade">O arquivo é processado no seu computador e não é enviado para a internet.</p>

    <p id="status" role="status"></p>
    <div id="resultados"></div>
  </main>

  <script type="javascript/worker" id="pdf-worker">/*WORKER*/</script>
  <script>/*PDFJS*/</script>
  <script>/*PDFLIB*/</script>
  <script>/*APP*/</script>
</body>
</html>
