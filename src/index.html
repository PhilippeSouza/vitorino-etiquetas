<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Montar Etiquetas</title>
  <style>
/*ESTILO*/
  </style>
</head>
<body>
  <main>
    <h1>Montar Etiquetas</h1>
    <p class="subtitulo">Junte DANFE e etiqueta na mesma folha A4, ou deixe todas as etiquetas em 10×15 cm para a impressora térmica.</p>

    <fieldset class="opcoes" id="opcoes">
      <legend>Formato de impressão</legend>
      <label class="opcao">
        <input type="radio" name="porFolha" value="1" checked>
        <span><strong>A4, 1 pedido</strong> Folha em pé, tamanho real</span>
      </label>
      <label class="opcao">
        <input type="radio" name="porFolha" value="2">
        <span><strong>A4, 2 pedidos</strong> Folha deitada, economiza papel (DANFE a ~66%)</span>
      </label>
      <label class="opcao">
        <input type="radio" name="porFolha" value="termica">
        <span><strong>Térmica 10×15</strong> Uma etiqueta por página, todas do mesmo tamanho</span>
      </label>
    </fieldset>

    <label class="zona" id="zona">
      <strong>Arraste o PDF aqui</strong>
      <span>ou clique para escolher (Shopee, TikTok, Amazon, Magalu, Bling)</span>
      <input type="file" id="entrada" accept="application/pdf,.pdf" multiple>
    </label>
    <p class="privacidade">O arquivo é processado no seu computador e não é enviado para a internet.</p>

    <p id="status" role="status"></p>
    <div id="resultados"></div>
  </main>

  <script type="javascript/worker" id="pdf-worker">/*WORKER*/</script>
  <script>/*PDFJS*/</script>
  <script>/*PDFLIB*/</script>
  <script>/*APP*/</script>
</body>
</html>
